name: Probe the site's per-verse digest

# One-off: fetch the raw HTML of a surah page and a tafsir page so the
# "Tabari on this ayah" digest can be inspected. The pages are committed to
# the branch and the workflow can be deleted afterwards.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-digest.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch
        run: |
          mkdir -p work/probe
          for u in "quran/2" "tafsir/105/1" "tafsir/1/1"; do
            name=$(echo "$u" | tr '/' '_')
            curl -sS -A "quran-explained-tabari-import/1.0" \
              "https://tafseerquran.com/en/$u" -o "work/probe/$name.html" || true
            echo "$name: $(wc -c < "work/probe/$name.html") bytes"
          done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f work/probe
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "probe: the site's per-verse digest markup"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
