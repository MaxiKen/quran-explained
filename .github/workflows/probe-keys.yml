name: Probe LLM secrets

# One-off: reports whether an LLM key is configured in the repository
# secrets, and nothing else. It writes "present" or "absent" — never a
# value, never a prefix — and commits the answer to the branch, because the
# job log cannot be read back from outside GitHub's own servers.

on:
  push:
    branches: ['arena/807f943d-quran-explained']
    paths: ['.github/workflows/probe-keys.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check which keys are configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p work/raw
          : > work/raw/probe-keys.txt
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name: present" >> work/probe-keys.txt
            else
              echo "$name: absent" >> work/probe-keys.txt
            fi
          done
          cat work/probe-keys.txt
      - name: Commit the answer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f work/raw/probe-keys.txt
          git commit -m "probe: which LLM keys are configured"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push rejected"
