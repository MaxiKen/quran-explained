name: Probe GitHub Models

# One-off: can a workflow call GitHub Models with the workflow's own token,
# without a paid provider key? Reports the HTTP status and the shape of the
# answer, never a token. The result is committed to the branch, because the
# job log cannot be read back from outside GitHub's own servers.

on:
  push:
    branches: ['arena/807f943d-quran-explained']
    paths: ['.github/workflows/probe-models.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask a model for a JSON answer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/raw
          out=work/raw/probe-models.txt
          : > "$out"
          for model in openai/gpt-4o-mini meta-llama/Llama-3.3-70B-Instruct; do
            body=$(cat <<JSON
          {"model": "$model", "messages": [{"role": "user", "content": "Reply with JSON only: {\\"ok\\": true, \\"n\\": 7}"}], "temperature": 0.2}
          JSON
            )
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              https://models.github.ai/inference/chat/completions || echo "curl-failed")
            echo "== $model -> HTTP $code" >> "$out"
            head -c 400 /tmp/resp.json >> "$out" || true
            echo >> "$out"
          done
          cat "$out"
      - name: Commit the answer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f work/raw/probe-models.txt
          git commit -m "probe: can GitHub Models be called from a workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push rejected"
