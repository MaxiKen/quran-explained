name: Tafsir al-Tabari import

# Imports the English translation of Tafsir al-Tabari from tafseerquran.com
# into data/tabari_NNN.json. The importer (tools/tabari/) needs plain internet
# access, which a GitHub runner has; it caches every fetched page under
# work/tabari/raw so a re-run does not hit the site again.
#
# The surahs to import are listed in tools/tabari/plan.json. Edit that file
# and push to run the import; the workflow commits the result to the branch it
# ran on.

on:
  push:
    paths:
      - 'tools/tabari/**'
      - '.github/workflows/tabari-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabari-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import
        run: |
          python3 tools/tabari/importer.py \
            --plan tools/tabari/plan.json \
            --out data \
            --raw work/tabari/raw || true
      - name: Verify
        run: python3 tools/tabari/verify.py --data data || true
      - name: Upload fetched pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabari-raw-pages
          path: work/tabari/raw
          retention-days: 14
          if-no-files-found: warn
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabari-report
          path: work/tabari/report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tabari_*.json
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "tabari: import the English translation of Tafsir al-Tabari"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
